<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triki Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232a78d6' stroke-width='4'/%3E%3Cpath d='M16 3a13 13 0 0 1 12.4 9' fill='none' stroke='%23eb6834' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --wash: rgba(11, 11, 11, 0.04);
    --wash-strong: rgba(42, 120, 214, 0.10);
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --border-strong: rgba(42, 120, 214, 0.45);
    --s1: #2a78d6;
    --primary-bg: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --face-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 18px 48px rgba(11, 11, 11, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --wash: rgba(255, 255, 255, 0.05);
      --wash-strong: rgba(57, 135, 229, 0.18);
      --text: #ffffff;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(57, 135, 229, 0.55);
      --s1: #3987e5;
      --face-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --wash: rgba(255, 255, 255, 0.05);
    --wash-strong: rgba(57, 135, 229, 0.18);
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(57, 135, 229, 0.55);
    --s1: #3987e5;
    --face-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100vh;
  }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px 24px 0; }
  .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .apps { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; padding: 3px; background: var(--surface); gap: 2px; }
  .apps a { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 7px; color: var(--text-2); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .apps a:hover { background: var(--wash); color: var(--text); }
  .apps a[aria-current="page"] { background: var(--wash-strong); color: var(--text); font-weight: 600; }
  .apps a:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
  .apps svg { flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; max-width: 100%; }
  .pill .icon { display: inline-flex; width: 16px; height: 16px; flex: none; }
  .pill .label { font-weight: 600; white-space: nowrap; }
  .pill .msg { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tone-good { color: var(--good); } .tone-warning { color: var(--warning); }
  .tone-serious { color: var(--serious); } .tone-critical { color: var(--critical); }
  .spin { animation: spin 1s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    appearance: none; font: inherit; font-size: 13px; height: 32px; padding: 0 12px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
    text-decoration: none;
  }
  .btn:hover:not(:disabled) { background: var(--wash); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { background: var(--wash-strong); border-color: var(--border-strong); }
  .btn:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  .btn.primary { background: var(--primary-bg); border-color: transparent; color: #fff; font-weight: 600; min-width: 128px; height: 40px; font-size: 14px; }
  .btn.primary:hover:not(:disabled) { background: var(--primary-bg); filter: brightness(1.08); }
  .btn.big { height: 40px; font-size: 14px; min-width: 72px; }
  .chip { height: 30px; border-radius: 999px; padding: 0 14px; font-size: 13px; }
  .battery { font-size: 12px; color: var(--text-2); white-space: nowrap; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 12px 16px; }
  .dial { position: relative; width: min(62vh, 88vw, 540px); aspect-ratio: 1; }
  .dial svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .face { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .dial .facebg { position: absolute; inset: 9.5%; border-radius: 50%; box-shadow: var(--face-shadow); pointer-events: none; }
  .tick { stroke: var(--grid); stroke-width: 1.5; stroke-linecap: round; }
  .tick.major { stroke: var(--baseline); stroke-width: 2.5; }
  .numeral { fill: var(--muted); font-size: 13px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
  .grip line { stroke: var(--grid); stroke-width: 3; stroke-linecap: round; }
  .track { fill: none; stroke: var(--grid); stroke-width: 14; }
  .arc { fill: none; stroke: var(--s1); stroke-width: 14; stroke-linecap: round; transition: opacity 0.2s; }
  .knob { fill: var(--s1); stroke: var(--surface); stroke-width: 4; transition: opacity 0.2s; }
  .paused .arc, .paused .knob { opacity: 0.45; }
  .ringing .track { stroke: var(--s1); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }

  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 22%; }
  .time { font-size: clamp(48px, 11.5vmin, 108px); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
  .state { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--text); min-height: 1.45em; display: flex; align-items: center; gap: 6px; }
  .state .icon { display: inline-flex; color: var(--s1); }
  .detail { margin-top: 2px; font-size: 13px; color: var(--text-2); min-height: 1.45em; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 620px; }
  .hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; color: var(--text-2); font-size: 13px; padding: 4px 16px 22px; }
  .hints span { display: inline-flex; align-items: center; gap: 7px; }
  .hints svg { color: var(--muted); flex: none; }

  @media (prefers-reduced-motion: reduce) {
    .spin, .ringing .track { animation: none; }
    .ringing .track { opacity: 0.6; }
  }
  @media (max-width: 640px) {
    header { padding: 14px 16px 0; }
    .tools .btn:not(#soundBtn) { height: 30px; font-size: 12px; padding: 0 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Triki</h1>
    <nav class="apps" aria-label="Triki apps">
      <a href="/"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12.5l4-5 3 3 6-7"/></svg>Dashboard</a>
      <a href="/timer" aria-current="page"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="9" r="5.5"/><path d="M8 6.2V9l1.8 1.2M6.5 1.5h3"/></svg>Timer</a>
      <a href="/paint"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5L13.6 2.4a1.4 1.4 0 0 1 2 2L8.5 11.5"/><path d="M5.5 10.5c-1.7 0-2.5 1-2.5 2.3 0 .9-.6 1.4-1.5 1.7 2.8.6 5.5-.2 5.5-2.5"/></svg>Paint</a>
    </nav>
    <div class="pill" role="status" aria-live="polite">
      <span class="icon" id="statusIcon"></span>
      <span class="label" id="statusLabel">Connecting</span>
      <span class="msg" id="statusMsg">to the server</span>
    </div>
    <span class="battery" id="battery"></span>
  </div>
  <div class="tools">
    <button class="btn" id="soundBtn" hidden>Enable sound</button>
    <button class="btn" id="ticksBtn" aria-pressed="true">Click sounds</button>
    <button class="btn" id="reverseBtn" aria-pressed="false" title="Use this if twisting clockwise takes time away">Reverse twist</button>
  </div>
</header>

<main>
  <div class="dial" id="dial">
    <div class="facebg"></div>
    <svg viewBox="-24 -24 448 448" aria-hidden="true">
      <circle class="face" cx="200" cy="200" r="190"></circle>
      <g id="ticks"></g>
      <g id="grip"></g>
      <circle class="track" cx="200" cy="200" r="158"></circle>
      <path class="arc" id="arc" d=""></path>
      <circle class="knob" id="knob" cx="200" cy="42" r="11"></circle>
    </svg>
    <div class="center">
      <div class="time" id="time" aria-live="off">0:00</div>
      <div class="state" id="state" aria-live="polite">Twist to set a timer</div>
      <div class="detail" id="detail"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn big" id="minusBtn" aria-label="Subtract one minute">− 1 min</button>
    <button class="btn primary" id="primaryBtn" disabled>Start</button>
    <button class="btn big" id="plusBtn" aria-label="Add one minute">+ 1 min</button>
    <button class="btn big" id="resetBtn" disabled>Reset</button>
  </div>
  <div class="presets" id="presets" aria-label="Presets"></div>
</main>

<div class="hints">
  <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.2 1.6v2.8H9.4"/></svg>Twist clockwise to add time</span>
  <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg>Hold still to start</span>
  <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 8h1.5l1.5-4 2.5 8 2-6 1.5 2H14"/></svg>Shake to pause or resume</span>
  <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7.5a4 4 0 0 1 8 0V11l1.2 1.5H2.8z"/><path d="M6.5 14h3"/></svg>Twist or shake to stop the alarm</span>
</div>

<script>
'use strict';
// ---------- tuning ----------
const ACC_LSB = 2048, GYR_LSB = 16.4, NOMINAL_DT = 1 / 52;
const DETENT_DEG = 15;        // one step of the "knob" per 15° of twist
const DEADBAND_DPS = 12;      // ignore slower rotation (sensor noise, drift)
const ARM_DELAY_MS = 2500;    // hold still this long after setting to start
const MAX_SEC = 3 * 3600;
const RING_TIMEOUT_MS = 180000;
const PRESETS = [1, 3, 5, 10, 15, 25, 45, 60];
const $ = id => document.getElementById(id);

// ---------- settings ----------
const settings = { reverse: false, ticks: true };
try {
  Object.assign(settings, JSON.parse(localStorage.getItem('triki-timer') || '{}'));
  const shared = localStorage.getItem('triki-twist-reverse');   // shared with Triki Paint
  if (shared !== null) settings.reverse = shared === '1';
} catch (e) {}
function saveSettings() {
  try {
    localStorage.setItem('triki-timer', JSON.stringify(settings));
    localStorage.setItem('triki-twist-reverse', settings.reverse ? '1' : '0');
  } catch (e) {}
}
function renderSettings() {
  $('reverseBtn').setAttribute('aria-pressed', String(settings.reverse));
  $('ticksBtn').setAttribute('aria-pressed', String(settings.ticks));
}
$('reverseBtn').addEventListener('click', () => { settings.reverse = !settings.reverse; saveSettings(); renderSettings(); });
$('ticksBtn').addEventListener('click', () => { settings.ticks = !settings.ticks; saveSettings(); renderSettings(); });
renderSettings();

// ---------- sound ----------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  return actx;
}
function unlockAudio() {
  const a = audio(); if (!a) return;
  if (a.state !== 'running') a.resume().then(updateSoundBtn, updateSoundBtn);
  updateSoundBtn();
}
function updateSoundBtn() { $('soundBtn').hidden = !actx || actx.state === 'running'; }
function tone(freq, start, dur, gain, type = 'sine') {
  const a = audio(); if (!a || a.state !== 'running') return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + start;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  tick: up => { if (settings.ticks) tone(up ? 2300 : 1700, 0, 0.035, 0.12, 'triangle'); },
  start: () => { tone(660, 0, 0.12, 0.15); tone(990, 0.1, 0.18, 0.15); },
  pause: () => { tone(880, 0, 0.1, 0.12); tone(660, 0.09, 0.14, 0.12); },
  stop: () => { tone(520, 0, 0.18, 0.12); },
};
let browserAlarm = null;   // used only when the server cannot play the alarm
function startBrowserAlarm() {
  stopBrowserAlarm();
  const beep = () => { tone(880, 0, 0.12, 0.2); tone(880, 0.19, 0.12, 0.2); tone(1175, 0.38, 0.22, 0.2); };
  beep(); browserAlarm = setInterval(beep, 1200);
}
function stopBrowserAlarm() { if (browserAlarm) clearInterval(browserAlarm); browserAlarm = null; }
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio));
$('soundBtn').addEventListener('click', unlockAudio);
unlockAudio();
setTimeout(updateSoundBtn, 400);

// ---------- server calls ----------
const api = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  .then(r => r.json()).catch(() => ({ ok: false }));

// ---------- timer state machine ----------
// idle → (twist) → armed → (hold still) → running → (time) → ringing → (twist/shake) → idle
//                                         ↕ shake
//                                       paused
const T = { state: 'idle', setSec: 0, endAt: 0, remaining: 0, armAt: 0, ringStart: 0, lastDuration: 0 };
let stepLog = [];   // snapshots before recent knob steps, undone if they turn out to be part of a shake

function value(now = performance.now()) {
  switch (T.state) {
    case 'running': return Math.max(0, (T.endAt - now) / 1000);
    case 'paused': return T.remaining;
    case 'ringing': return 0;
    default: return T.setSec;
  }
}
function zoneStep(v) { return v < 60 ? 10 : v < 600 ? 30 : v < 1800 ? 60 : v < 3600 ? 300 : 600; }
function stepValue(v, dir) {
  if (dir > 0) { const s = zoneStep(v); return Math.min(MAX_SEC, Math.floor(v / s + 1e-6) * s + s); }
  const s = zoneStep(Math.max(0, v - 0.001));
  return Math.max(0, Math.ceil(v / s - 1e-6) * s - s);
}
function setValue(nv, now = performance.now()) {
  nv = Math.max(0, Math.min(MAX_SEC, nv));
  if (T.state === 'idle' || T.state === 'armed') {
    T.setSec = nv;
    if (nv > 0) { T.state = 'armed'; T.armAt = now + ARM_DELAY_MS; } else T.state = 'idle';
  } else if (T.state === 'running') {
    if (nv <= 0) cancel(); else T.endAt = now + nv * 1000;
  } else if (T.state === 'paused') {
    if (nv <= 0) cancel(); else T.remaining = nv;
  }
}
function onDetent(dir) {
  const now = performance.now();
  if (T.state === 'ringing') { if (now - T.ringStart > 400) stopAlarm(); return; }
  const v = value(now), nv = stepValue(v, dir);
  if (Math.abs(nv - v) < 1e-6) return;
  stepLog = stepLog.filter(s => now - s.at < 1500);
  stepLog.push({ at: now, snap: Object.assign({}, T) });
  sfx.tick(dir > 0);
  setValue(nv, now);
  render();
}
function start(now = performance.now()) {
  if (T.setSec <= 0) return;
  T.state = 'running'; T.endAt = now + T.setSec * 1000; T.lastDuration = T.setSec;
  sfx.start(); api('/api/blink', { times: 2 });
  renderPresets(); render();
}
function pause() { T.remaining = value(); T.state = 'paused'; sfx.pause(); render(); }
function resume() { T.state = 'running'; T.endAt = performance.now() + T.remaining * 1000; sfx.start(); render(); }
function cancel() { T.state = 'idle'; T.setSec = 0; sfx.stop(); render(); }
async function ring() {
  T.state = 'ringing'; T.ringStart = performance.now();
  render();
  const r = await api('/api/alarm', { on: true });
  if (T.state === 'ringing' && !r.sound) startBrowserAlarm();
}
function stopAlarm() {
  api('/api/alarm', { on: false }); stopBrowserAlarm();
  T.state = 'idle'; T.setSec = 0; sfx.stop();
  render();
}
function onShake() {
  const now = performance.now();
  stepLog = stepLog.filter(s => now - s.at < 1200);
  if (stepLog.length) { Object.assign(T, stepLog[0].snap); stepLog = []; }   // undo knob steps caused by the shake itself
  if (T.state === 'ringing') stopAlarm();
  else if (T.state === 'running') pause();
  else if (T.state === 'paused') resume();
  else if (T.state === 'armed') { T.remaining = T.setSec; T.state = 'paused'; sfx.pause(); }
  render();
}
function primaryAction() {
  if (T.state === 'ringing') stopAlarm();
  else if (T.state === 'running') pause();
  else if (T.state === 'paused') resume();
  else if (T.setSec > 0) start();
}
function tickState(now = performance.now()) {
  if (T.state === 'armed' && now >= T.armAt) start(now);
  else if (T.state === 'running' && now >= T.endAt) ring();
  else if (T.state === 'ringing' && now - T.ringStart > RING_TIMEOUT_MS) stopAlarm();
}

// ---------- controls ----------
$('primaryBtn').addEventListener('click', primaryAction);
$('resetBtn').addEventListener('click', () => { if (T.state === 'ringing') stopAlarm(); else cancel(); });
$('plusBtn').addEventListener('click', () => { if (T.state === 'ringing') return; setValue(value() + 60); sfx.tick(true); render(); });
$('minusBtn').addEventListener('click', () => { if (T.state === 'ringing') return; setValue(value() - 60); sfx.tick(false); render(); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button, a') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ') { primaryAction(); e.preventDefault(); }
  else if (e.key === 'Escape') { T.state === 'ringing' ? stopAlarm() : cancel(); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { onDetent(1); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { onDetent(-1); e.preventDefault(); }
});
function renderPresets() {
  const box = $('presets'); box.textContent = '';
  const add = (label, sec) => {
    const b = document.createElement('button');
    b.className = 'btn chip'; b.textContent = label;
    b.addEventListener('click', () => {
      if (T.state === 'ringing') stopAlarm();
      T.state = 'idle'; T.setSec = sec; start();
    });
    box.append(b);
  };
  PRESETS.forEach(m => add(m + ' min', m * 60));
  if (T.lastDuration && !PRESETS.includes(T.lastDuration / 60)) add('Repeat ' + fmtTime(T.lastDuration), T.lastDuration);
}

// ---------- dial ----------
const NS = 'http://www.w3.org/2000/svg', CX = 200, CY = 200, R = 158;
(function buildDial() {
  const ticks = $('ticks');
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2, major = i % 5 === 0;
    const r1 = major ? 168 : 173, r2 = 182;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', CX + r1 * Math.sin(a)); l.setAttribute('y1', CY - r1 * Math.cos(a));
    l.setAttribute('x2', CX + r2 * Math.sin(a)); l.setAttribute('y2', CY - r2 * Math.cos(a));
    l.setAttribute('class', major ? 'tick major' : 'tick');
    ticks.append(l);
    if (major) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', CX + 205 * Math.sin(a)); t.setAttribute('y', CY - 205 * Math.cos(a));
      t.setAttribute('class', 'numeral'); t.textContent = String(i);
      ticks.append(t);
    }
  }
  const grip = $('grip');
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * Math.PI * 2, l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', CX + 124 * Math.sin(a)); l.setAttribute('y1', CY - 124 * Math.cos(a));
    l.setAttribute('x2', CX + 132 * Math.sin(a)); l.setAttribute('y2', CY - 132 * Math.cos(a));
    grip.append(l);
  }
})();
function arcPath(frac) {
  if (frac <= 0) return '';
  if (frac >= 0.9999) return `M ${CX} ${CY - R} A ${R} ${R} 0 1 1 ${CX} ${CY + R} A ${R} ${R} 0 1 1 ${CX} ${CY - R}`;
  const a = frac * Math.PI * 2;
  return `M ${CX} ${CY - R} A ${R} ${R} 0 ${frac > 0.5 ? 1 : 0} 1 ${CX + R * Math.sin(a)} ${CY - R * Math.cos(a)}`;
}
function fmtTime(sec, running) {
  const s = running ? Math.ceil(sec - 1e-3) : Math.round(sec);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`;
}
const BELL = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7.5a4 4 0 0 1 8 0V11l1.2 1.5H2.8z"/><path d="M6.5 14h3"/></svg>';
let lastStateKey = '';
function render(now = performance.now()) {
  const v = value(now), running = T.state === 'running';
  const frac = Math.min(v, 3600) / 3600;
  $('arc').setAttribute('d', arcPath(frac));
  const a = frac * Math.PI * 2;
  $('knob').setAttribute('cx', CX + R * Math.sin(a));
  $('knob').setAttribute('cy', CY - R * Math.cos(a));
  $('knob').style.opacity = T.state === 'idle' && v === 0 ? 0.35 : '';
  $('grip').setAttribute('transform', `rotate(${(knobDeg % 360).toFixed(2)} ${CX} ${CY})`);
  const dial = $('dial');
  dial.classList.toggle('paused', T.state === 'paused');
  dial.classList.toggle('ringing', T.state === 'ringing');

  const timeText = fmtTime(v, running);
  $('time').textContent = timeText;

  let state = '', detail = '', icon = '';
  if (T.state === 'idle') { state = 'Twist to set a timer'; detail = connected ? 'Clockwise adds time' : 'Or use the presets below'; }
  else if (T.state === 'armed') { state = `Starting in ${Math.max(1, Math.ceil((T.armAt - now) / 1000))} s`; detail = 'Keep twisting to adjust'; }
  else if (running) { state = 'Running'; detail = 'Ends at ' + new Date(Date.now() + v * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  else if (T.state === 'paused') { state = 'Paused'; detail = 'Shake or press Resume'; }
  else if (T.state === 'ringing') { state = "Time's up"; icon = BELL; detail = 'Twist or shake the Triki to stop'; }
  const key = state + icon;
  if (key !== lastStateKey) {
    const el = $('state'); el.textContent = '';
    if (icon) { const i = document.createElement('span'); i.className = 'icon'; i.innerHTML = icon; el.append(i); }
    el.append(document.createTextNode(state));
    lastStateKey = key;
  }
  $('detail').textContent = detail;

  const pb = $('primaryBtn');
  pb.textContent = T.state === 'ringing' ? 'Stop alarm' : running ? 'Pause' : T.state === 'paused' ? 'Resume' : 'Start';
  pb.disabled = (T.state === 'idle' || T.state === 'armed') && T.setSec <= 0;
  $('resetBtn').disabled = T.state === 'idle' && T.setSec === 0;
  document.title = T.state === 'ringing' ? "Time's up · Triki Timer" : (running || T.state === 'paused') ? `${timeText} · Triki Timer` : 'Triki Timer';
}

// ---------- motion processing ----------
const M = { bias: [0, 0, 0], biasReady: false, win: [], lastT: null, acc: 0, lastTwistT: -1, suppressUntil: -1, peaks: [], lastPeakT: -1 };
let knobDeg = 0;
function onSample(r, live) {
  const t = r[1];
  const g = [r[2] / GYR_LSB, r[3] / GYR_LSB, r[4] / GYR_LSB];
  const a = [r[5] / ACC_LSB, r[6] / ACC_LSB, r[7] / ACC_LSB];
  const amag = Math.hypot(a[0], a[1], a[2]);

  // learn the gyro bias whenever the controller rests for ~0.8 s
  M.win.push([g[0], g[1], g[2], amag]);
  if (M.win.length > 40) M.win.shift();
  if (M.win.length === 40) {
    const m = [0, 0, 0];
    for (const w of M.win) { m[0] += w[0] / 40; m[1] += w[1] / 40; m[2] += w[2] / 40; }
    let dev = 0, adev = 0;
    for (const w of M.win) { dev = Math.max(dev, Math.abs(w[0] - m[0]), Math.abs(w[1] - m[1]), Math.abs(w[2] - m[2])); adev = Math.max(adev, Math.abs(w[3] - 1)); }
    if (dev < 2 && adev < 0.08) { const k = M.biasReady ? 0.02 : 1; for (let i = 0; i < 3; i++) M.bias[i] += k * (m[i] - M.bias[i]); M.biasReady = true; }
  }
  if (!live) return;

  let dt = M.lastT === null ? NOMINAL_DT : t - M.lastT;
  M.lastT = t;
  if (!(dt > 0.001 && dt < 0.15)) dt = NOMINAL_DT;

  // shake: 3 sharp acceleration peaks within a second
  const dyn = Math.abs(amag - 1);
  if (dyn > 1.0 && t - M.lastPeakT > 0.09) { M.peaks.push(t); M.lastPeakT = t; }
  M.peaks = M.peaks.filter(p => t - p < 1.0);
  if (M.peaks.length >= 3) { M.peaks = []; M.suppressUntil = t + 0.8; M.acc = 0; onShake(); return; }
  if (dyn > 0.5) M.suppressUntil = Math.max(M.suppressUntil, t + 0.25);

  // twist around the controller's own Z axis (perpendicular to its face)
  let rate = g[2] - M.bias[2];
  if (settings.reverse) rate = -rate;
  const cw = -rate;    // right-hand rule: clockwise seen from the face is negative about +Z
  if (Math.abs(cw) > DEADBAND_DPS && t >= M.suppressUntil) {
    const d = cw * dt;
    knobDeg += d; M.acc += d; M.lastTwistT = t;
    while (M.acc >= DETENT_DEG) { M.acc -= DETENT_DEG; onDetent(1); }
    while (M.acc <= -DETENT_DEG) { M.acc += DETENT_DEG; onDetent(-1); }
  } else if (t - M.lastTwistT > 0.6) {
    M.acc = 0;   // a partial turn doesn't carry over to the next twist
  }
  if (T.state === 'armed' && t - M.lastTwistT < 0.3) T.armAt = Math.max(T.armAt, performance.now() + ARM_DELAY_MS);
}

// ---------- connection ----------
const ICONS = {
  check: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2l1.9 1.9 3.7-4"/></svg>',
  spin: '<svg class="spin" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 1.5a6.5 6.5 0 1 1-6.5 6.5"/></svg>',
  alert: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8l6.6 11.7H1.4z"/><path d="M8 6.3v3.2M8 11.6v.1"/></svg>',
  x: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="8" cy="8" r="6.5"/><path d="M5.7 5.7l4.6 4.6M10.3 5.7l-4.6 4.6"/></svg>',
};
const STATES = {
  streaming: { tone: 'good', icon: 'check', label: 'Triki connected' },
  connecting: { tone: 'warning', icon: 'spin', label: 'Connecting' },
  scanning: { tone: 'warning', icon: 'spin', label: 'Looking for the Triki' },
  starting: { tone: 'warning', icon: 'spin', label: 'Starting' },
  not_found: { tone: 'serious', icon: 'alert', label: 'Triki not found' },
  reconnecting: { tone: 'serious', icon: 'alert', label: 'Reconnecting' },
  offline: { tone: 'critical', icon: 'x', label: 'Server offline' },
};
let connected = false, lastSeq = 0, boot = null, status = {};
function renderStatus() {
  const def = STATES[status.state] || STATES.starting;
  const icon = $('statusIcon');
  icon.className = 'icon tone-' + def.tone;
  icon.innerHTML = ICONS[def.icon];
  $('statusLabel').textContent = def.label;
  const msg = status.state === 'not_found' ? 'retrying… is it on?' : status.state === 'offline' ? status.message || '' : '';
  $('statusMsg').textContent = msg; $('statusMsg').hidden = !msg;
  connected = status.state === 'streaming';
  $('battery').textContent = connected && status.battery >= 0 ? `Battery ${status.battery}%` : '';
}
function connect() {
  const es = new EventSource('/events');
  es.addEventListener('status', e => {
    const st = JSON.parse(e.data);
    if (st.boot && st.boot !== boot) { boot = st.boot; lastSeq = 0; M.lastT = null; }
    status = Object.assign({}, status, st);
    renderStatus();
  });
  es.addEventListener('imu', e => {
    const msg = JSON.parse(e.data), live = !msg.history;
    for (const r of msg.s) { if (r[0] <= lastSeq) continue; lastSeq = r[0]; onSample(r, live); }
    tickState();   // data arrives ~17×/s, which keeps the timer exact even when the window is in the background
  });
  es.onerror = () => {
    if (es.readyState !== EventSource.OPEN) { status = Object.assign({}, status, { state: 'offline', message: 'Run apps/TrikiApps.py' }); renderStatus(); }
  };
}

// Switching to another Triki app would lose a running timer, so ask first.
window.addEventListener('beforeunload', e => {
  if (T.state !== 'idle') { e.preventDefault(); e.returnValue = ''; }
});

// ---------- loop ----------
function frame() { tickState(); render(); requestAnimationFrame(frame); }
setInterval(tickState, 250);   // backup when no motion data is flowing
renderPresets();
renderStatus();
connect();
requestAnimationFrame(frame);
</script>
